modules:
  jira:projectPage:
    - key: response-templates-project-forge
      resource: main
      resolver:
        function: resolver
      title: Response Templates
      layout: blank
      icon: https://response-templates.appbox.ai/assets/images/response-template-dark.svg
      displayConditions:
        or:
          entityPropertyEqualTo:
            entity: project
            propertyKey: com.appbox.ai.response.templates_project-admin-settings
            objectName: responseTemplatesEnabled
            value: "true"
          and:
            not:
              entityPropertyExists:
                entity: project
                propertyKey: com.appbox.ai.response.templates_project-admin-settings
                objectName: responseTemplatesEnabled
            or:
              entityPropertyEqualTo:
                entity: app
                propertyKey: com.appbox.ai.response.templates_default-project-enabled
                value: "true"
              not:
                entityPropertyExists:
                  entity: app
                  propertyKey: com.appbox.ai.response.templates_default-project-enabled
  jira:issuePanel:
    - key: response-templates-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Response Templates
      icon: https://response-templates.appbox.ai/assets/images/response-template-dark.svg
      displayConditions:
        or:
          entityPropertyEqualTo:
            entity: project
            propertyKey: com.appbox.ai.response.templates_project-admin-settings
            objectName: responseTemplatesEnabled
            value: "true"
          and:
            not:
              entityPropertyExists:
                entity: project
                propertyKey: com.appbox.ai.response.templates_project-admin-settings
                objectName: responseTemplatesEnabled
            or:
              entityPropertyEqualTo:
                entity: app
                propertyKey: com.appbox.ai.response.templates_default-project-enabled
                value: "true"
              not:
                entityPropertyExists:
                  entity: app
                  propertyKey: com.appbox.ai.response.templates_default-project-enabled
  jira:adminPage:
    - key: response-templates-admin
      resource: main
      resolver:
        function: resolver
      title: Response Templates for Jira - Admin Panel
      layout: blank
      icon: https://response-templates.appbox.ai/assets/images/response-template-dark.svg
  trigger:
    - key: migrate-legacy-templates
      function: migrate
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
    - key: migrate-default-project-enabled
      function: migrate-default
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  function:
    - key: migrate
      handler: index.migrateLegacyTemplates
    - key: migrate-default
      handler: index.migrateDefaultProjectEnabled
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/forge-angular-app/dist/response-templates

app:
  # Update this to the Forge app ARI for the free marketplace listing.
  id: ari:cloud:ecosystem::app/REPLACE_WITH_FREE_APP_ID
  connect:
    key: com.appbox.ai.response.templates.free
  runtime:
    name: nodejs22.x
  licensing:
    enabled: false
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:project.property:jira
    - write:project.property:jira
    - read:jira-user
    - read:avatar:jira
    - storage:app
  content:
    styles:
      - unsafe-inline
    scripts:
      - unsafe-eval
