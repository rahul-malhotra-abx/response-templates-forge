modules:
  jira:projectPage:
    - key: response-templates-project-forge
      resource: main
      resolver:
        function: resolver
      title: Response Templates
      layout: blank
      icon: https://response-templates.appbox.ai/assets/images/response-template-dark.svg
      displayConditions:
        or:
          not:
            entityPropertyExists:
              entity: project
              propertyKey: com.appbox.ai.response.templates_project-admin-settings
          and:
            entityPropertyExists:
              entity: project
              propertyKey: com.appbox.ai.response.templates_project-admin-settings
            entityPropertyEqualTo:
              entity: project
              propertyKey: com.appbox.ai.response.templates_project-admin-settings
              objectName: responseTemplatesEnabled
              value: "true"
  jira:issuePanel:
    - key: response-templates-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Response Templates
      icon: https://response-templates.appbox.ai/assets/images/response-template-dark.svg
      displayConditions:
        or:
          not:
            entityPropertyExists:
              entity: project
              propertyKey: com.appbox.ai.response.templates_project-admin-settings
          and:
            entityPropertyExists:
              entity: project
              propertyKey: com.appbox.ai.response.templates_project-admin-settings
            entityPropertyEqualTo:
              entity: project
              propertyKey: com.appbox.ai.response.templates_project-admin-settings
              objectName: responseTemplatesEnabled
              value: "true"
  jira:adminPage:
    - key: response-templates-admin
      resource: main
      resolver:
        function: resolver
      title: Response Templates for Jira - Admin Panel
      layout: blank
      icon: https://response-templates.appbox.ai/assets/images/response-template-dark.svg
  trigger:
    - key: migrate-legacy-templates
      function: migrate
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  function:
    - key: migrate
      handler: index.migrateLegacyTemplates
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/forge-angular-app/dist/response-templates

app:
  id: ari:cloud:ecosystem::app/a316f704-652a-4a80-b9fe-ff7754dba7d4
  connect:
    key: com.appbox.ai.response.templates
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:project.property:jira
    - write:project.property:jira
    - read:jira-user
    - read:avatar:jira
    - storage:app
  content:
    styles:
      - unsafe-inline
    scripts:
      - unsafe-eval
