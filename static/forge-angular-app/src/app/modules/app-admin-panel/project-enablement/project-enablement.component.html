<div class="p-5 pt-4">
  <h3>Response Template - Project Enablement</h3>

  <div class="p-3" *ngIf="!pageLoaded">
    <div class="page-loader-wrapper ms-1">
      <div class="page-loader"></div>
      <i class="fa fa-sort-amount-up page-loader-icon"></i>
      <div class="page-loader-text">Loading Projects...</div>
    </div>
  </div>
  <div class="p-3" *ngIf="pageLoaded">
    <div class="ribbon d-flex align-items-center justify-content-between">
      <div class="search">
        <input type="text" name="search" autocomplete="off" [(ngModel)]="searchFilter.name" placeholder="Search Name." class="form-control" />
      </div>
      <div class="d-flex align-items-center">
        <label class="me-2 mb-0 fw-normal" for="rt-default-status">Default status for new projects:</label>
        <select id="rt-default-status" class="form-select w-auto" [(ngModel)]="defaultEnabled" (change)="updateDefault()">
          <option [ngValue]="true">Enabled</option>
          <option [ngValue]="false">Disabled</option>
        </select>
      </div>
    </div>
    <table class="table table-hover">
      <colgroup>
        <col width="auto" />
        <col width="200" />
        <col width="190" />
      </colgroup>
      <thead>
        <tr>
          <th>Name</th>
          <th>Lead</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let project of projects | filterBy: searchFilter; let $index = index">
          <td>
            <img
              *ngIf="!project.avatarUnavailable; else projectAvatarFallback"
              class="project-avatar"
              [ngbTooltip]="project.key"
              [src]="project.avatarObjectUrl || project.avatarUrls['24x24']"
              (error)="loadProjectAvatarFallback(project)"
              width="20"
              height="20"
              [alt]="project.key" />
            <ng-template #projectAvatarFallback>
              <span class="project-avatar project-avatar-fallback" [ngbTooltip]="project.key">
                {{ getProjectAvatarInitials(project) }}
              </span>
            </ng-template>
            &nbsp; {{ project.name }}
          </td>
          <td>
            <img [src]="project.lead.avatarUrls['24x24']" width="20" />
            &nbsp;
            <a [href]="UtilService.getParentDomain() + '/people/' + project.lead.accountId" target="_blank">{{ project.lead.displayName }}</a>
          </td>
          <td>
            <select
              class="form-select cursor-pointer"
              [(ngModel)]="project.status"
              (change)="updateStatus(project)"
              [id]="'rt-enabled-' + $index">
              <option value="default">Default [{{ defaultEnabled ? 'Enabled' : 'Disabled' }}]</option>
              <option value="enabled">Enabled</option>
              <option value="disabled">Disabled</option>
            </select>
          </td>
        </tr>
        <tr *ngIf="(projects | filterBy: searchFilter)?.length === 0">
          <td colspan="6" class="text-center">No projects</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
