<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Response Templates Editor</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #172b4d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Relative on purpose: Forge serves static resources from a hashed CDN path, so absolute
         asset URLs (create-react-app's default) 404. The Angular build already uses --deploy-url ./
         for the same reason. -->
    <script src="./static/js/main.js"></script>
  </body>
</html>
